name: CI

on:
  pull_request:
    # Intermediate bases need the same checks as PRs targeting trunk.
    branches: [trunk, "codex/**"]
  push:
    branches: [trunk]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (${{ matrix.crate }}${{ matrix.enforce && ' pedantic' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Server is the public crate with published releases — we gate
          # pedantic strictly. `-D warnings` turns the workspace-level
          # `clippy::pedantic = warn` into a hard error here.
          - crate: durable-streams-server
            enforce: true
          # Client pedantic findings are reported (non-fatal) for now.
          # When the client is ready to pass pedantic, flip `enforce: true`
          # or merge back into the strict list.
          - crate: durable-streams-client
            enforce: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (strict)
        if: matrix.enforce
        run: cargo clippy -p ${{ matrix.crate }} --all-targets -- -D warnings
      - name: clippy (advisory)
        if: ${{ !matrix.enforce }}
        run: cargo clippy -p ${{ matrix.crate }} --all-targets

  check:
    name: cargo check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.89.0"
          - stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  server-public-api:
    name: server public API snapshot (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-server-public-api.sh

  server-conformance:
    name: server conformance (memory backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: ./scripts/conformance/run-server-suite.sh

  # Aggregate gate. Branch protection requires this single check — we don't
  # have to keep the ruleset in sync with matrix leg names. If any upstream
  # job fails, is cancelled, or is skipped, this job fails.
  ci-pass:
    name: CI pass
    if: always()
    needs: [fmt, clippy, check, test, doc, server-public-api, server-conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "upstream job results: ${{ join(needs.*.result, ',') }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
