name: Pre-release

# Release-candidate validation, including the disk-backend matrix and client suite.
# The public API snapshot also runs in the PR gate.
#
# Runs manually via "Run workflow" in the Actions tab, or automatically
# when a per-crate release tag is pushed (for example
# `durable-streams-server-v0.3.1`).

on:
  workflow_dispatch:
  push:
    tags:
      - "durable-streams-server-v*"
      - "durable-streams-client-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  server-public-api:
    name: server public API snapshot (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read API snapshot toolchain
        id: api-toolchain
        run: echo "toolchain=$(cat crates/durable-streams-server/tests/public-api-toolchain.txt)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.api-toolchain.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-server-public-api.sh

  server-conformance-backends:
    name: server conformance (${{ matrix.backend.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: memory
            env: {}
          - name: file-fast
            env:
              DS_STORAGE__MODE: file-fast
          - name: file-durable
            env:
              DS_STORAGE__MODE: file-durable
          - name: acid-file
            env:
              DS_STORAGE__MODE: acid
              DS_STORAGE__ACID_BACKEND: file
          - name: acid-memory
            env:
              DS_STORAGE__MODE: acid
              DS_STORAGE__ACID_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - env: ${{ matrix.backend.env }}
        run: ./scripts/conformance/run-server-suite.sh

  client-conformance:
    name: client conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: ./scripts/conformance/run-client-suite.sh --fail-fast
