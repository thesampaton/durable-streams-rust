name: Release PR (changelog)

# Maintains a standing "release PR" against trunk that reflects the
# current `[Unreleased]` state of each managed crate's CHANGELOG.md.
#
# This workflow ONLY runs the `release-pr` subcommand — it never publishes
# to crates.io and never creates tags or GitHub releases. The `release-plz.toml`
# config is also configured for `publish = false`, `git_tag_enable = false`,
# and `git_release_enable = false` as belt-and-suspenders so even a
# misconfigured future workflow step can't accidentally publish.
#
# Authentication uses a GitHub App installation token (secrets
# `RELEASE_PLZ_APP_ID` + `RELEASE_PLZ_APP_PRIVATE_KEY`). This matters
# because PRs created with the default `GITHUB_TOKEN` do NOT trigger
# workflow runs (GitHub anti-loop safeguard) — so the CI `CI pass` gate
# would never fire on the release PR and the merge button would stay
# blocked. Installation tokens from an app are treated as a distinct
# actor, so CI runs normally on release-plz PRs.
#
# When you actually want to release:
#   1. Merge the open release PR (bumps version + finalises CHANGELOG on trunk).
#   2. Tag the commit with `<crate>-v<version>` and push the tag.
#      The Pre-release workflow will run against the tag for validation.
#   3. Publish manually (or add a separate `release-plz release` workflow
#      once trusted-publishing is configured).

on:
  push:
    branches: [trunk]

permissions:
  # Workflow-level permissions kept minimal — the GitHub App installation
  # token issued below is what actually writes the release PR.
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: release-plz release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release-pr
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
