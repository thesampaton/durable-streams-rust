[package]
name = "durable-streams-client"
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"
publish = false
description = "Production-oriented Rust Durable Streams client."
readme = "README.md"

[dependencies]
base64 = "0.22.1"
bytes = { version = "1.10", features = ["serde"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
futures-util = "0.3.31"
http = "1.3"
memchr = "2.8.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt", "sync", "time"] }
toml = "0.9.7"
tracing = "0.1.41"
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
tempfile = "3.21.0"

[lints]
workspace = true
