# Baseline production profile without direct TLS termination.
#
# Typical use:
# - TLS terminates at an ingress, load balancer, or service proxy
# - backend link to durable-streams-server stays HTTP
# - add proxy trust settings in an override file if the backend must trust
#   forwarded origin metadata

[storage]
mode = "file-durable" # memory | file-fast | file-durable | acid
data_dir = "/var/lib/durable-streams" # used by file-fast, file-durable, acid

[limits]
max_memory_bytes = 536870912 # total in-process payload bytes
max_stream_bytes = 268435456 # max bytes retained per stream

# Acid-only example:
# acid_shard_count = 16 # power of two in 1..=256
# acid_backend = "file" # file | in-memory
