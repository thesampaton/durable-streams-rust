# Production profile for direct mTLS termination on the server.
#
# Typical use:
# - clients or a trusted service proxy authenticate with client certs
# - proxy identity handoff is only valid in this transport mode

[storage]
mode = "file-durable" # memory | file-fast | file-durable | acid
data_dir = "/var/lib/durable-streams" # used by file-fast, file-durable, acid

[limits]
max_memory_bytes = 536870912 # total in-process payload bytes
max_stream_bytes = 268435456 # max bytes retained per stream

[transport]
mode = "mtls" # http | tls | mtls

[transport.http]
versions = ["http1", "http2"] # http2 requires matching h2 ALPN below

[transport.tls]
# Set cert_path, key_path, and client_ca_path in your local override file or env.
alpn_protocols = ["http/1.1", "h2"] # match transport.http.versions
# cert_path = "/etc/durable-streams/tls/server.crt"
# key_path = "/etc/durable-streams/tls/server.key"
# client_ca_path = "/etc/durable-streams/tls/client-ca.crt" # required in mtls mode
# min_version = "1.2" # defaults are usually sufficient unless you need to pin them
# max_version = "1.3"

# Example trusted proxy identity handoff:
#
# [proxy]
# enabled = true
# forwarded_headers = "forwarded"
# trusted_proxies = ["10.0.10.15/32", "10.0.10.16/32"]
#
# [proxy.identity]
# mode = "header" # none | header
# header_name = "x-client-identity" # trusted proxy-provided identity header
# require_tls = true # keep true unless you deliberately allow non-TLS outer hops
