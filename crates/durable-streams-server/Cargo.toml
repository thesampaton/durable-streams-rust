[package]
name = "durable-streams-server"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "Durable Streams protocol server in Rust, built with axum and tokio"
license = "MIT"
repository = "https://github.com/thesampaton/durable-streams-rust"
homepage = "https://github.com/thesampaton/durable-streams-rust"
readme = "README.md"
keywords = ["streaming", "event-sourcing", "durable-streams", "sse", "long-polling"]
categories = ["web-programming::http-server", "network-programming"]
exclude = ["CLAUDE.md", "**/CLAUDE.md"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Spec versions implemented:
# - Spec SHA: 8e3ef080ec3a74745ce363d59322f1cbe6de19cc
# - Conformance: 0.3.0

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1.50", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tower-http = { version = "0.6.8", features = ["cors"] }
bytes = "1.11"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pemfile = "2.2"
async-stream = "0.3.6"
futures-util = "0.3.32"
redb = "4"
seahash = "4.1.0"
figment = { version = "0.10.19", features = ["toml"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["stream"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.2"
proptest = "1"
public-api = "0.51.0"
rustdoc-json = "0.9.9"
tempfile = "3"
